<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<!--=====-->
		<title>Supa Front Page</title>
		<!--=====--->
		<link rel="stylesheet" href="./style.css">
	</head>
	<body>
		<header>
			<h1>Supa Front Page</h1>
			<button id="headbum" aria-label="Open menu">
				<span></span>
				<span></span>
				<span></span>
			</button>
		</header>

		<div id="curtain" class="blur">
			<button id="closebum" class="bumclose">
				<span></span>
				<span></span>
				<span></span>
			</button>
			<nav id="porter">
				<a href="#linker">Quicklink</a>
				<a href="#console-box">Console</a>
			</nav>
		</div>
		<!---=====--->
		<br>
		<!---=====--->
		<div id="linker" class="quicklink">
			<h3>Link to stuff:</h3>
			<div class="gpt">
				<p>ChatGPT's:</p>
				<a id="null-oracle" href="../ballerstuff/AI/ChatGPT/nulloracle/">ChatGPT's Null Oracle</a>
			</div>
			<div class="copi">
				<p>Github CoPilot's:</p>
				<a id="launch-deck" href="../ballerstuff/AI/Github%20CoPilot/LaunchDeck/">Github CoPilot's Launch Deck</a>
			</div>
		</div>
		<!---=====--->
		<br>
		<!---=====--->
		<div id="console-box" class="console">
			<div id="console-header">JavaScript Console</div>
			<div id="console-output"></div>
			<div id="console-input-row">
				<span class="prompt">&gt;</span> <!-- '&gt; is '>' -->
				<textarea id="console-input" rows="3" placeholder="Type to the console..."></textarea>
				<button id="console-run">RUN</button>
			</div>
		</div>
		<!---=====--->
		<script src="./script.js"></script>
	</body>
</html>
